global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  1000s
    timeout server  1000s
    timeout tunnel  1h      # For WebSocket/Socket.IO
    retries 3
    
frontend http_front
    bind *:5000
    
    # Detect Socket.IO/WebSocket requests
    acl is_websocket path_beg /socket.io
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket hdr_beg(Host) -i ws

    use_backend websocket_backend if is_websocket

    default_backend app_backend

backend app_backend
    balance roundrobin
    server s1 app1:5000 check
    server s2 app2:5000 check
    server s3 app3:5000 check

backend websocket_backend
    # Use source IP hashing for sticky sessions
    balance source
    
    option http-server-close
    
    server s1 app1:5000 weight 1 maxconn 1024 check
    server s2 app2:5000 weight 1 maxconn 1024 check
    server s3 app3:5000 weight 1 maxconn 1024 check
